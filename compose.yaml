name: groovekeeper

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: groovekeeper-web
    restart: unless-stopped
    ports:
      - "${GROOVEKEEPER_WEB_PORT:?Set GROOVEKEEPER_WEB_PORT in .env}:3002"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: groovekeeper-api
    restart: unless-stopped
    environment:
      GROOVEKEEPER_VISION_HOST: 0.0.0.0
      GROOVEKEEPER_VISION_PORT: 8765
      GROOVEKEEPER_VISION_PROVIDER: ${GROOVEKEEPER_VISION_PROVIDER:-ollama}
      GROOVEKEEPER_OLLAMA_URL: http://ollama:11434
      GROOVEKEEPER_OLLAMA_MODEL: ${GROOVEKEEPER_OLLAMA_MODEL:-qwen2.5vl:3b}
      GROOVEKEEPER_OLLAMA_CONTEXT: ${GROOVEKEEPER_OLLAMA_CONTEXT:-2048}
      GROOVEKEEPER_OLLAMA_NUM_PREDICT: ${GROOVEKEEPER_OLLAMA_NUM_PREDICT:-320}
      GROOVEKEEPER_OLLAMA_KEEP_ALIVE: ${GROOVEKEEPER_OLLAMA_KEEP_ALIVE:-2m}
      GROOVEKEEPER_MISTRAL_API_KEY: ${GROOVEKEEPER_MISTRAL_API_KEY:-}
      GROOVEKEEPER_MISTRAL_OCR_MODEL: ${GROOVEKEEPER_MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      GROOVEKEEPER_DATABASE: /data/groovekeeper.sqlite3
      GROOVEKEEPER_DISCOGS_TOKEN: ${GROOVEKEEPER_DISCOGS_TOKEN:-}
      GROOVEKEEPER_USER_AGENT: ${GROOVEKEEPER_USER_AGENT:-Groovekeeper/1.0 +self-hosted}
    expose:
      - "8765"
    volumes:
      - groovekeeper_data:/data
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    container_name: groovekeeper-ollama
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: ${GROOVEKEEPER_OLLAMA_CONTEXT:-2048}
      OLLAMA_KEEP_ALIVE: ${GROOVEKEEPER_OLLAMA_KEEP_ALIVE:-2m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    image: ollama/ollama:latest
    container_name: groovekeeper-model-setup
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      GROOVEKEEPER_VISION_PROVIDER: ${GROOVEKEEPER_VISION_PROVIDER:-ollama}
      GROOVEKEEPER_OLLAMA_MODEL: ${GROOVEKEEPER_OLLAMA_MODEL:-qwen2.5vl:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["case \"$${GROOVEKEEPER_VISION_PROVIDER}\" in mistral|mistral-ocr|mistral_ocr) echo 'Mistral OCR selected; skipping Ollama model download.' ;; *) ollama pull \"$${GROOVEKEEPER_OLLAMA_MODEL}\" ;; esac"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  groovekeeper_data:
  ollama_models:
