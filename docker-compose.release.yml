name: recordshelf

services:
  web:
    image: ghcr.io/recordshelf-owner/recordshelf-web:latest
    container_name: recordshelf-web
    restart: unless-stopped
    ports:
      - "${RECORDSHELF_WEB_PORT:?Set RECORDSHELF_WEB_PORT in .env}:3002"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ghcr.io/recordshelf-owner/recordshelf-api:latest
    container_name: recordshelf-api
    restart: unless-stopped
    environment:
      RECORDSHELF_VISION_HOST: 0.0.0.0
      RECORDSHELF_VISION_PORT: 8765
      RECORDSHELF_VISION_PROVIDER: ${RECORDSHELF_VISION_PROVIDER:-ollama}
      RECORDSHELF_OLLAMA_URL: http://ollama:11434
      RECORDSHELF_OLLAMA_MODEL: ${RECORDSHELF_OLLAMA_MODEL:-qwen2.5vl:3b}
      RECORDSHELF_OLLAMA_CONTEXT: ${RECORDSHELF_OLLAMA_CONTEXT:-2048}
      RECORDSHELF_OLLAMA_NUM_PREDICT: ${RECORDSHELF_OLLAMA_NUM_PREDICT:-320}
      RECORDSHELF_OLLAMA_KEEP_ALIVE: ${RECORDSHELF_OLLAMA_KEEP_ALIVE:-2m}
      RECORDSHELF_MISTRAL_API_KEY: ${RECORDSHELF_MISTRAL_API_KEY:-}
      RECORDSHELF_MISTRAL_OCR_MODEL: ${RECORDSHELF_MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      RECORDSHELF_DATABASE: /data/recordshelf.sqlite3
      RECORDSHELF_DISCOGS_TOKEN: ${RECORDSHELF_DISCOGS_TOKEN:-}
      RECORDSHELF_USER_AGENT: ${RECORDSHELF_USER_AGENT:-RecordShelf/1.0 +self-hosted}
    expose:
      - "8765"
    volumes:
      - recordshelf_data:/data
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    container_name: recordshelf-ollama
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: ${RECORDSHELF_OLLAMA_CONTEXT:-2048}
      OLLAMA_KEEP_ALIVE: ${RECORDSHELF_OLLAMA_KEEP_ALIVE:-2m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - recordshelf_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    image: ollama/ollama:latest
    container_name: recordshelf-model-setup
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      RECORDSHELF_VISION_PROVIDER: ${RECORDSHELF_VISION_PROVIDER:-ollama}
      RECORDSHELF_OLLAMA_MODEL: ${RECORDSHELF_OLLAMA_MODEL:-qwen2.5vl:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["case \"$${RECORDSHELF_VISION_PROVIDER}\" in mistral|mistral-ocr|mistral_ocr) echo 'Mistral OCR selected; skipping Ollama model download.' ;; *) ollama pull \"$${RECORDSHELF_OLLAMA_MODEL}\" ;; esac"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  recordshelf_data:
    name: ${RECORDSHELF_DATA_VOLUME:-recordshelf_data}
  recordshelf_models:
    name: ${RECORDSHELF_MODEL_VOLUME:-recordshelf_models}
